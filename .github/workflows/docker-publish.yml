name: CI/CD to Kubernetecs Cluster

on:
  push:
    branches: [ "main" ]
   
permissions:
  contents: read
  packages: write

jobs:
  # This workflow contains a single job called "build"
  build-and-push:
    runs-on: ubuntu-latest
    env:
      #DOCKER_IMAGE_NAME: ${{ github.repository_owner }}/patient-mgnt-hl7-api
      DOCKER_IMAGE_NAME: mulesie/patient-mgnt-hl7-api
      DOCKER_IMAGE_TAG_BUILD: ${{ github.run_number }}

    outputs:
      docker_tag: ${{ env.DOCKER_IMAGE_TAG_BUILD }}
      
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: mvn clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Deployment YAML
        run: |
          DOCKER_IMAGE_TAG=${{ steps.meta.outputs.tags }}
          sed -i "s|image: ${DOCKER_IMAGE_NAME}:.*|image: ${env.DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}|" ./k8s/local_deployment.yaml

       
