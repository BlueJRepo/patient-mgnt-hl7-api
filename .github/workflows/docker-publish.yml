name: CI/CD to Kubernetecs Cluster

on:
  push:
    branches: [ "main" ]
   
permissions:
  contents: write
  packages: write

jobs:
  # This workflow contains a single job called "build"
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: mulesie/patient-mgnt-hl7-api
      DOCKER_IMAGE_TAG_BUILD: ${{ github.run_number }}
      
    outputs:
      docker_tag: ${{ env.DOCKER_IMAGE_TAG_BUILD }}
      
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: mvn clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=${{ env.DOCKER_IMAGE_TAG_BUILD }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Deployment YAML
        run: |
          DOCKER_IMAGE_TAG=${{ env.DOCKER_IMAGE_TAG_BUILD }}
          sed -i "s|image: DOCKER_HUB_IMAGE|image: ${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}|" k8s/local-kube-config.yaml

      - name: Commit and Push Changes
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }} 
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
        run: |
          echo  "===================================================="
          echo  "$REPOSITORY_OWNER" | sed 's/./& /g'
          echo  "$GIT_USER_EMAIL" | sed 's/./& /g'
          echo  "$GIT_USER_NAME" | sed 's/./& /g'
          echo  "$GIT_TOKEN" | sed 's/./& /g'
          echo  "===================================================="
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git add k8s/local-kube-config.yaml
          git commit -m "Update Docker Image Tag to ${{ env.DOCKER_IMAGE_TAG_BUILD }}"
          git push
       


       
