name: Creates a release artifact

on:
 workflow_dispatch:


run-name: 'Creates release artifact: run_id: ${{ github.run_id }}, package_name: dcu-sharepoint-api-${{ github.ref_name }}-1.0.${{ github.run_number }}'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 11
    - name: Build with Maven
      env:
        nexus_username: ${{ secrets.nexus_username }}
        nexus_password: ${{ secrets.nexus_password }}
      run: mvn -B package --settings .maven/settings.xml --file ${{ github.workspace }}/**/pom.xml -DskipMunitTests 
    - name: Relabel the artifact
      env:
       pkg_name: ${{ vars.pkg_name }}
      run: |
        rName=$pkg_name-${GITHUB_REF##*/}-1.0.${{ github.run_number }}.jar
        mv ${{ github.workspace }}/**/target/*.jar ${{ github.workspace }}/$pkg_name/target/$rName
        echo "Jar file name: $rName"
    - name: Upload artifact 
      uses: actions/upload-artifact@v3
      with:
          name: artifacts
          path: ${{ github.workspace }}/**/target/*.jar
          retention-days: 90
