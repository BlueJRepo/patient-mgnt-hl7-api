name: Deploys artifacts to mule runtime.

on:
 workflow_dispatch:
    inputs: 
      run_id:
        type: string
        description: 'Provide GitHub Actions run_id'
        required: true 
      mule_environment:
        type: choice
        description: 'Mule Environment to deploy'
        required: true
        options: 
        - Sandbox
        - Production


run-name: 'Deployment at Mule ${{ inputs.mule_environment}}'


jobs:

  deploy:
    name: Deploying in ${{ inputs.mule_environment}}
    runs-on: ubuntu-latest
    environment: ${{ inputs.mule_environment }}
    outputs:
      noRelArti: ${{ steps.checkRelArti.outputs.noRelArti }}
    steps:
    - name: Check Out
      uses: actions/checkout@v3
      with:
       ref: main 
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-   
    - name: Download artifact from ${{ inputs.run_id}}
      uses: actions/github-script@v6
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     run_id: ${{ inputs.run_id}}
                  });

            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: allArtifacts.data.artifacts[0].id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${{ github.workspace }}/artifacts.zip`, Buffer.from(download.data));

    - name: 'Unzip artifact'
      id: checkRelArti
      run: |
       unzip artifacts.zip
       echo "noRelArti=false" >> "$GITHUB_OUTPUT"
       artifactName=$(ls ${{ github.workspace }}/**/target/*.jar | head -1)
        if [[ ${{ inputs.mule_environment}} == 'Production' ]]
        then
          if [[ $artifactName != *"$api_name-main-1.0"* ]];
          then
          echo "noRelArti=true" >> "$GITHUB_OUTPUT"
          fi
        fi
       echo  "Is this No-Release artifact ?: "${{ steps.checkRelArti.outputs.noRelArti }}

    - name: Deploy
      if: ${{ steps.checkRelArti.outputs.noRelArti == 'false' }}
      env:
        CON_APP_ID: ${{ secrets.connectedAppClientId }}
        CON_APP_SEC: ${{ secrets.connectedAppClientSecret }}
        SECURE_KEY: ${{ secrets.secure_key }}
        CLIENT_ID: ${{ secrets.anypoint_platform_client_id }}
        CLIENT_SECRET: ${{ secrets.anypoint_platform_client_secret }}
        API_ID: ${{ vars.API_ID }}
        MULE_ENV: ${{ vars.mule_env }}
        API_NAME: ${{ vars.api_name }}        
      run: |
        artifactName=$(ls ${{ github.workspace }}/**/target/*.jar | head -1)
        echo "artifact name: "$artifactName
        mvn mule:deploy --settings .maven/settings.xml --file ${{ github.workspace }}/**/pom.xml -DmuleDeploy \
         -Dmule.artifact=$artifactName \
         -DconnectedAppClientId="$CON_APP_ID" \
         -DconnectedAppClientSecret="$CON_APP_SEC" \
         -Danypoint.platform.client_id="$CLIENT_ID" \
         -Danypoint.platform.client_secret="$CLIENT_SECRET" \
         -Dsecure.key="$SECURE_KEY" \
         -Dmule.renv="${{ inputs.mule_environment }}"  \
         -Dmule.env=$MULE_ENV \
         -Dapi.id=$API_ID \
         -Dapi_name=$API_NAME \
         -DskipMunitTests