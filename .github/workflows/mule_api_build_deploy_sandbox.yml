name: Creates a nonprod artifact and deploys to Sandbox

on:
  push:
    branches:
     - sandbox
    paths-ignore:
      - '.gitignore'
      - '.github/**'


run-name: 'Build & Deploy in Mule Sandbox: Branch: ${{ github.ref_name }}, Run_id: ${{ github.run_id }}, Package_name: my-first-api-${{ github.ref_name }}-1.0.${{ github.run_number }} '

jobs:
  swaggerUpload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 11
    - name: Extract OAS file
      run: ls -al
      
