name: Creates a nonprod artifact and deploys to Sandbox

on:
  push:
    branches:
     - sandbox
    paths-ignore:
      - '.gitignore'
      - '.github/**'


run-name: 'Build & Deploy in Mule Sandbox: Branch: ${{ github.ref_name }}, Run_id: ${{ github.run_id }}, Package_name: dcu-sharepoint-api-${{ github.ref_name }}-1.0.${{ github.run_number }} '

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 11
    - name: Build with Maven
      env:
        CON_APP_ID: ${{ secrets.connectedAppClientId }}
        CON_APP_SEC: ${{ secrets.connectedAppClientSecret }}      
        nexus_username: ${{ secrets.nexus_username }}
        nexus_password: ${{ secrets.nexus_password }}
      run: mvn -B package --settings .maven/settings.xml --file ${{ github.workspace }}/**/pom.xml -DskipMunitTests
    - name: Relabel the artifact
      env:
       pkg_name: ${{ vars.pkg_name }}
      run: |
        rName=$pkg_name-${GITHUB_REF##*/}-1.0.${{ github.run_number }}.jar
        mv ${{ github.workspace }}/**/target/*.jar ${{ github.workspace }}/$pkg_name/target/$rName
        echo "Jar file name: $rName"
    - name: Upload artifact 
      uses: actions/upload-artifact@v3
      with:
          name: artifacts
          path: ${{ github.workspace }}/**/target/*.jar
          retention-days: 90
        
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: Sandbox
    steps:    
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: Download the artifact
      uses: actions/download-artifact@v3
      with:
        name: artifacts
    - name: Display structure of downloaded files
      run: ls -R
    - name: Deploy to Sandbox    
      env:
        CON_APP_ID: ${{ secrets.connectedAppClientId }}
        CON_APP_SEC: ${{ secrets.connectedAppClientSecret }}
        SECURE_KEY: ${{ secrets.secure_key }}
        CLIENT_ID: ${{ secrets.anypoint_platform_client_id }}
        CLIENT_SECRET: ${{ secrets.anypoint_platform_client_secret }}
        API_ID: ${{ vars.API_ID }}
        MULE_ENV: ${{ vars.mule_env }}
        API_NAME: ${{ vars.api_name }}       
      run: |
        artifactName=$(ls ${{ github.workspace }}/**/target/*.jar | head -1)
        echo "artifact_Name: "$artifactName
        mvn mule:deploy --settings .maven/settings.xml --file ${{ github.workspace }}/**/pom.xml -DmuleDeploy \
         -Dmule.artifact=$artifactName \
         -DconnectedAppClientId="$CON_APP_ID" \
         -DconnectedAppClientSecret="$CON_APP_SEC" \
         -Danypoint.platform.client_id="$CLIENT_ID" \
         -Danypoint.platform.client_secret="$CLIENT_SECRET" \
         -Dsecure.key="$SECURE_KEY" \
         -Dmule.renv="Sandbox" \
         -Dmule.env=$MULE_ENV \
         -Dapi.id=$API_ID \
         -Dapi_name=$API_NAME \
         -DskipMunitTests
